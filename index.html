    if(p.x<-100||p.x>W+100)p.life=0}
  PR=PR.filter(p=>p.life>0&&!p.rm);
  for(const z of Z){z.t-=dt;if(z.t<=0&&!z.fired){z.fired=1;z.v=.22;flash=Math.max(flash,.25);fcol='#cfeeff';shake=Math.max(shake,.5);beep(90,.2,.08);const O=oth(z.own);if(Math.abs(O.x-z.x)<44*S&&O.y>GY-70*S)hurt(O,z.own,z.dmg,300,.4,0,260)}if(z.fired)z.v-=dt}
  Z=Z.filter(z=>!z.fired||z.v>0)}
const IN={jp:0};
function startMatch(){wins=[0,0];rnd=1;AR=LAD[li];mkbg(AR);F1=mkF(ME,0,0);F2=mkF(AR,1,li);$('n1').textContent=CH[ME].n;$('n1').style.color=CH[ME].acc;$('n2').textContent=CH[AR].n;$('n2').style.color=CH[AR].acc;startRound()}
function startRound(){$('ov').classList.add('hide');for(const[F,s]of[[F1,0],[F2,1]]){F.x=W*(s?.7:.3);F.y=GY;F.vy=0;F.hp=F.mhp;F.f=s?-1:1;F.act=null;F.at=-1;F.hu=0;F.kx=0;F.dead=0;F.bound=0;F.c1=F.c2=F.cw=0}
  PR=[];Z=[];Q=[];tm=60;st='intro';it=1.7;fb=0;banner('الجولة '+ar(rnd))}
function afterKo(){if(wins[0]>=2||wins[1]>=2)endMatch();else{rnd++;startRound()}}
function ov(h){const o=$('ov');o.innerHTML=h;o.classList.remove('hide')}
function endMatch(){st='over';if(wins[0]>=2){if(li<LAD.length-1){const n=CH[LAD[li+1]];ov('<h1>فزت!</h1><p>الخصم التالي: '+n.n+' ('+n.el+')</p><button class="gb" onclick="li++;startMatch()">القتال التالي</button>')}
  else ov('<h1>بطل الساحة</h1><p>هزمت المقاتلين الثلاثة بكل تقنياتهم.</p><button class="gb" onclick="showSel()">العب مجددًا</button>')}
  else ov('<h1>هُزمت</h1><p>سقطت أمام '+CH[AR].n+'.</p><button class="gb" onclick="startMatch()">حاول مجددًا</button><button class="gb" onclick="showSel()">مقاتل آخر</button>')}
function showMenu(){st='menu';ov('<h1>ساحة الظل</h1><p>قتال نينجا واحد ضد واحد. اختر مقاتلك، واهزم الثلاثة الآخرين في ساحاتهم، لكل واحد منهم تقنياته الخاصة.</p><p class="d">يُفضَّل اللعب بالوضع الأفقي<br>لوحة المفاتيح: A D حركة · W قفز · S درع · J ضربة · K ١ · L ٢ · I ★</p><button class="gb" onclick="showSel()">ابدأ</button>')}
function showSel(){st='menu';let h='<h2>اختر مقاتلك</h2><div class="gr">';CH.forEach((d,i)=>{h+='<div class="cd" style="--c:'+d.acc+'" onclick="pick('+i+')"><h3>'+d.n+'</h3><small>'+d.el+'</small><ul><li>اضرب · كومبو ثلاثي</li>'+d.T.map(a=>'<li>'+a[0]+' · '+a[1]+'</li>').join('')+'</ul></div>'});ov(h+'</div>')}
function pick(i){ME=i;LAD=[0,1,2,3].filter(j=>j!==i);li=0;startMatch()}
function fig(o,al){const d=CH[o.ci],s=S;let col=d.col,acc=d.acc;if(o.fl>0)col=acc='#fff';
  x.save();x.translate(o.x,o.y);x.globalAlpha=al||1;x.fillStyle='rgba(0,0,0,.5)';x.beginPath();x.ellipse(0,GY-o.y,26*s,7*s,0,0,6.3);x.fill();
  if(o.dead)x.rotate(-o.f*1.45);x.scale(o.f,1);
  const air=o.y<GY-6*s,w=o.mv?Math.sin(o.ph):0,bob=o.mv?Math.abs(Math.cos(o.ph))*3*s:Math.sin(t*3+o.x)*1.2*s,hy=-38*s-bob;let ln=o.at>=0?9*s:0;if(o.hu>0&&!o.bound)ln=-9*s;
  x.lineCap=x.lineJoin='round';x.strokeStyle=col;x.lineWidth=9*s;
  for(const k of[-1,1]){x.beginPath();x.moveTo(0,hy);x.lineTo(air?k*16*s:k*w*15*s+(o.at>=0?k*9*s:0),air?-8*s:-2*s);x.stroke()}
  x.lineWidth=15*s;x.beginPath();x.moveTo(0,hy);x.lineTo(ln*.6,hy-27*s);x.stroke();
  x.strokeStyle=acc;x.lineWidth=5*s;x.beginPath();x.moveTo(-6*s,hy-8*s);x.lineTo(8*s+ln*.5,hy-12*s);x.stroke();
  const hx=ln+2*s,hyy=hy-40*s;x.fillStyle=acc;x.strokeStyle=acc;
  if(o.ci==0)for(let i=-1;i<2;i++){x.beginPath();x.moveTo(hx-8*s+i*8*s,hyy-6*s);x.lineTo(hx-14*s+i*9*s,hyy-27*s+Math.abs(i)*7*s);x.lineTo(hx+i*8*s+2*s,hyy-8*s);x.fill()}
  if(o.ci==1){x.beginPath();x.moveTo(hx-10*s,hyy-2*s);x.lineTo(hx-30*s,hyy-14*s);x.lineTo(hx-6*s,hyy-12*s);x.lineTo(hx+8*s,hyy-26*s);x.lineTo(hx+10*s,hyy-6*s);x.fill()}
  if(o.ci==2){x.lineWidth=7*s;x.beginPath();x.moveTo(hx-8*s,hyy-4*s);x.quadraticCurveTo(hx-30*s,hyy+10*s+Math.sin(t*4)*3*s,hx-30*s,hyy+34*s);x.stroke()}
  if(o.ci==3){x.beginPath();x.arc(hx-2*s,hyy-15*s,8*s,0,6.3);x.fill()}
  x.fillStyle=o.fl>0?'#fff':'#d9a98a';x.beginPath();x.arc(hx,hyy,10*s,0,6.3);x.fill();
  x.fillStyle=col;x.beginPath();x.arc(hx,hyy-2*s,10.5*s,3.4,6.1);x.fill();if(o.ci>=2)x.fillRect(hx-10*s,hyy+1*s,20*s,8*s);
  x.fillStyle=acc;x.fillRect(hx-10*s,hyy-6*s,20*s,5*s);x.fillStyle=o.ci==1?'#8fe8ff':'#fff';x.fillRect(hx+3*s,hyy-1*s,5*s,2.5*s);
  x.strokeStyle=acc;x.lineWidth=(o.ci==3?6:4.5)*s;x.beginPath();x.moveTo(hx-9*s,hyy-4*s);x.quadraticCurveTo(hx-24*s,hyy-6*s+Math.sin(t*9+o.x)*6*s,hx-(o.ci==3?52:40)*s,hyy+4*s+Math.cos(t*7+o.x)*7*s);x.stroke();
  const sx=ln*.8,sy=hy-27*s;x.strokeStyle=col;x.lineWidth=7*s;x.beginPath();x.moveTo(sx,sy);x.lineTo(sx-10*s-w*8*s,sy+18*s);x.stroke();
  const a=o.bl?-.35:o.at>=0?-1.4+o.at*2.7:.9,hxx=sx+Math.cos(a)*24*s,hy2=sy+Math.sin(a)*24*s;x.beginPath();x.moveTo(sx,sy);x.lineTo(hxx,hy2);x.stroke();
  const ba=o.at>=0?a-.35:o.bl?-1.5:1.2;x.strokeStyle='#e8f4ff';x.lineWidth=3.5*s;x.beginPath();x.moveTo(hxx,hy2);x.lineTo(hxx+Math.cos(ba)*36*s,hy2+Math.sin(ba)*36*s);x.stroke();
  if(o.bl){x.strokeStyle=acc;x.globalAlpha=.55;x.lineWidth=5*s;x.beginPath();x.arc(10*s,hy-26*s,40*s,-1.2,1.2);x.stroke()}
  x.restore();
  if(o.bound>0){x.strokeStyle='#b66bff';x.lineWidth=4;for(let i=0;i<3;i++){x.beginPath();x.ellipse(o.x,o.y-30*s-i*22*s,24*s,7*s,0,0,6.3);x.stroke()}}}
function draw(){x.save();if(shake>0)x.translate((Math.random()-.5)*16*shake,(Math.random()-.5)*16*shake);
  x.drawImage(bg,0,0,W,H);const v=CH[AR].v;x.fillStyle=CH[AR].am;x.strokeStyle=CH[AR].am;
  for(const a of amb){const px=((a.x*W+v[0]*t*a.s)%W+W)%W,py=((a.y*H+v[1]*t*a.s)%H+H)%H;if(AR==1){x.globalAlpha=.4;x.beginPath();x.moveTo(px,py);x.lineTo(px+v[0]*.03,py+18);x.stroke()}else{x.globalAlpha=.7;x.fillRect(px,py,3*S*a.s+1,3*S*a.s+1)}}x.globalAlpha=1;
  for(const z of Z){if(!z.fired){const p=1-z.t/z.m;x.strokeStyle='rgba(143,232,255,'+(.2+.6*p)+')';x.lineWidth=3;x.beginPath();x.ellipse(z.x,GY,44*S*(1.1-p*.3),10*S,0,0,6.3);x.stroke()}else{x.fillStyle='rgba(220,245,255,'+z.v*4+')';x.fillRect(z.x-12*S,0,24*S,GY);x.fillStyle='rgba(143,232,255,'+z.v*2+')';x.fillRect(z.x-38*S,0,76*S,GY)}}
  if(F1){for(const F of[F1,F2].sort((a,b)=>a.dead-b.dead))fig(F);
    for(const F of[F1,F2])if(F.act&&F.act.ty==='atk'&&F.at>.3&&F.at<.95){const p=F.at;x.save();x.translate(F.x,F.y-55*S);x.scale(F.f,1);x.lineCap='round';x.strokeStyle='rgba(220,248,255,'+(1-p*.6)+')';x.lineWidth=(F.act.cb==2?20:12)*(1-p*.5)*S;x.beginPath();x.arc(0,0,(F.act.cb==2?80:66)*S,-1.5,-1.5+2.9*p);x.stroke();x.restore()}}
  for(const p of PR){const a=p.own.sk.acc;
    if(p.ty==='clone'){fig({ci:p.own.ci,x:p.x,y:p.y+55*S,f:Math.sign(p.vx),ph:t*22,mv:1,at:-1,hu:0,bl:0,fl:0},.55);continue}
    if(p.ty==='fire'){const g=x.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*1.6);g.addColorStop(0,'#fff6c8');g.addColorStop(.4,'#ff9a1f');g.addColorStop(1,'rgba(255,60,20,0)');x.fillStyle=g;x.beginPath();x.arc(p.x,p.y,p.r*1.6,0,6.3);x.fill();if(Math.random()<.8)ps.push({x:p.x,y:p.y,vx:-p.vx*.2,vy:(Math.random()-.5)*60,life:.3,col:'#ff7a2a'})}
    if(p.ty==='blade'){x.strokeStyle='#e0ffe8';x.lineWidth=5*S;x.lineCap='round';x.beginPath();x.arc(p.x-Math.sign(p.vx)*14*S,p.y,26*S,Math.sign(p.vx)>0?-1:2.14,Math.sign(p.vx)>0?1:4.14);x.stroke()}
    if(p.ty==='tor'){for(let i=0;i<7;i++){const k=i/6;x.strokeStyle='rgba(180,255,210,'+(.8-k*.4)+')';x.lineWidth=4*S;x.beginPath();x.ellipse(p.x+Math.sin(t*14+i)*10*S,p.y+p.r-k*p.r*2,p.r*(.3+k*.7),p.r*.18,0,0,6.3);x.stroke()}}}
  for(const p of ps){if(p.ring){const k=1-p.life/.4;x.strokeStyle='rgba(224,255,232,'+(1-k)+')';x.lineWidth=8*(1-k);x.beginPath();x.ellipse(p.x,p.y,170*S*k,100*S*k,0,0,6.3);x.stroke();continue}x.globalAlpha=Math.max(0,p.life*2.5);x.fillStyle=p.col;x.fillRect(p.x-2,p.y-2,4,4)}x.globalAlpha=1;
  const vg=x.createRadialGradient(W/2,H/2,H*.4,W/2,H/2,Math.max(W,H)*.75);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.5)');x.fillStyle=vg;x.fillRect(-20,-20,W+40,H+40);
  x.restore();if(flash>0){x.globalAlpha=Math.min(.6,flash);x.fillStyle=fcol;x.fillRect(0,0,W,H);x.globalAlpha=1}}
function hud(){if(!F1)return;$('h1').style.transform='scaleX('+F1.hp/F1.mhp+')';$('h2').style.transform='scaleX('+F2.hp/F2.mhp+')';$('m1').style.transform='scaleX('+F1.mt/100+')';$('m2').style.transform='scaleX('+F2.mt/100+')';
  $('tm').textContent=ar(Math.ceil(tm));for(const i of[1,2])$('d'+i).innerHTML=[0,1].map(k=>'<span class="dt'+(wins[i-1]>k?' on':'')+'"></span>').join('');
  $('at').style.opacity=F1.act?.6:1;$('s1').style.opacity=F1.c1>0?.35:1;$('s2').style.opacity=F1.c2>0?.35:1;$('ul').style.opacity=F1.mt>=100?1:.35;$('ul').style.boxShadow=F1.mt>=100?'0 0 18px #ffd54a':'none'}
let last=performance.now();
function loop(n){let dt=Math.min(.04,(n-last)/1000);last=n;if(slow>0){slow-=dt;dt*=.35}t+=dt;shake=Math.max(0,shake-dt*2.2);flash=Math.max(0,flash-dt*2.2);
  if(AR==1&&Math.random()<.004){flash=.3;fcol='#cfeeff'}
  if(F1){if(hs>0)hs-=dt;else step(dt)}
  for(const p of ps){if(p.ring){p.life-=dt;continue}p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}ps=ps.filter(p=>p.life>0);
  draw();hud();requestAnimationFrame(loop)}
function hold(id,k){const e=$(id);e.addEventListener('pointerdown',ev=>{ev.preventDefault();TB[k]=1});['pointerup','pointerleave','pointercancel'].forEach(n=>e.addEventListener(n,()=>TB[k]=0))}
hold('lf','l');hold('rt','r');hold('bk','bk');
$('jp').addEventListener('pointerdown',e=>{e.preventDefault();IN.jp=1});
[['at','atk'],['s1','K'],['s2','L'],['ul','I']].forEach(([i,k])=>$(i).addEventListener('pointerdown',e=>{e.preventDefault();tryAct(F1,F2,k)}));
addEventListener('keydown',e=>{if(e.repeat)return;keys[e.code]=true;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
  if(e.code==='KeyW'||e.code==='ArrowUp')IN.jp=1;if(e.code==='KeyJ')tryAct(F1,F2,'atk');if(e.code==='KeyK')tryAct(F1,F2,'K');if(e.code==='KeyL')tryAct(F1,F2,'L');if(e.code==='KeyI')tryAct(F1,F2,'I')});
addEventListener('keyup',e=>keys[e.code]=false);
rs();F1=mkF(0,0,0);F2=mkF(1,1,0);$('n1').textContent='';showMenu();requestAnimationFrame(loop);
