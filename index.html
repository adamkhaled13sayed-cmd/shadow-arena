<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ساحة التقنيات: صراع الأسطورة</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0d0d1a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-container {
            width: 100vw;
            height: 100vh;
            max-width: 850px;
            max-height: 480px;
            background: linear-gradient(to bottom, #111122, #1a1a3a, #0f2b48);
            position: relative;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.25);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        /* HUD UI */
        .hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 18px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            z-index: 10;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .health-bar-container {
            width: 40%;
        }
        .character-name {
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
            color: #e0e0e0;
        }
        .bar-bg {
            width: 100%;
            height: 14px;
            background: #222;
            border-radius: 7px;
            overflow: hidden;
            border: 1px solid #444;
            position: relative;
        }
        .hp-fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #ff3366, #ff9900);
            transition: width 0.2s ease;
            box-shadow: 0 0 8px #ff3366;
        }
        .energy-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00d2ff, #0072ff);
            transition: width 0.1s linear;
            box-shadow: 0 0 8px #00d2ff;
        }
        .stage-badge {
            background: rgba(255, 204, 0, 0.15);
            border: 1px solid #ffcc00;
            color: #ffcc00;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            text-shadow: 0 0 5px rgba(255, 204, 0, 0.5);
        }
        
        /* Battlefield */
        #arena {
            flex-grow: 1;
            position: relative;
            overflow: hidden;
            background: radial-gradient(circle at center, rgba(30,30,60,0.4) 0%, rgba(10,10,20,0.8) 100%);
        }
        .character {
            position: absolute;
            bottom: 35px;
            width: 65px;
            height: 95px;
            transition: transform 0.1s;
        }
        #player {
            left: 60px;
        }
        #enemy {
            right: 60px;
            transform: scaleX(-1);
        }
        
        /* Character Visuals */
        .char-body {
            width: 100%;
            height: 100%;
            position: relative;
            border-radius: 10px 10px 2px 2px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
        }
        .player-visual {
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            box-shadow: 0 0 15px rgba(0, 198, 255, 0.6);
            border: 2px solid #80dfff;
        }
        .enemy-visual {
            background: linear-gradient(135deg, #ff0055, #990033);
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.6);
            border: 2px solid #ff80ab;
        }

        .shield-aura {
            position: absolute;
            top: -10px;
            left: -10px;
            right: -10px;
            bottom: -10px;
            border-radius: 50%;
            border: 3px solid #00f0ff;
            box-shadow: 0 0 20px #00f0ff, inset 0 0 15px #00f0ff;
            animation: rotateShield 2s linear infinite;
            display: none;
        }
        @keyframes rotateShield {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* Projectiles */
        .projectile {
            position: absolute;
            bottom: 65px;
            border-radius: 50%;
            transform: translateY(50%);
            z-index: 5;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 14px;
        }

        /* Controls Deck */
        .controls-deck {
            height: 110px;
            background: rgba(10, 10, 22, 0.95);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 8px 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 10;
            gap: 8px;
        }
        .tech-card {
            flex: 1;
            height: 90px;
            background: linear-gradient(145deg, #18182e, #121224);
            border: 1px solid #333355;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 8px 4px;
            cursor: pointer;
            position: relative;
            transition: all 0.2s ease;
        }
        .tech-card.active {
            border-color: #00f0ff;
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.3);
            background: linear-gradient(145deg, #1e1e3f, #151530);
        }
        .tech-card.active:active {
            transform: scale(0.95);
        }
        .tech-card.disabled {
            opacity: 0.35;
            filter: grayscale(0.8);
            cursor: not-allowed;
        }
        .tech-icon {
            font-size: 26px;
            margin-top: 2px;
        }
        .tech-name {
            font-size: 11px;
            font-weight: bold;
            text-align: center;
            color: #ffffff;
        }
        .tech-cost {
            font-size: 10px;
            color: #00d2ff;
            font-weight: bold;
            background: rgba(0, 210, 255, 0.1);
            padding: 2px 6px;
            border-radius: 10px;
        }

        /* Overlay UI Screens */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 20, 0.95);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            text-align: center;
            padding: 20px;
        }
        .btn {
            background: linear-gradient(45deg, #00c6ff, #0072ff);
            border: none;
            color: white;
            padding: 14px 36px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0, 198, 255, 0.4);
            margin-top: 20px;
            transition: transform 0.15s, box-shadow 0.15s;
        }
        .btn:active {
            transform: scale(0.95);
        }
        
        /* Clash System Overlay */
        .clash-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 12, 0.85);
            backdrop-filter: blur(4px);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 15;
        }
        .clash-meter-bg {
            width: 70%;
            height: 20px;
            background: #222;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid #fff;
            margin: 20px 0;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
        }
        .clash-meter-fill {
            height: 100%;
            width: 50%;
            background: linear-gradient(90deg, #ff0055, #ffcc00, #00f0ff);
            transition: width 0.05s ease-out;
        }
        .tap-btn {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: radial-gradient(circle, #ff0055, #880022);
            border: 4px solid #ffffff;
            color: white;
            font-size: 22px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 25px #ff0055;
            cursor: pointer;
            user-select: none;
            touch-action: manipulation;
        }
        .tap-btn:active {
            transform: scale(0.92);
            box-shadow: 0 0 35px #ff0055;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- HUD Header -->
        <div class="hud">
            <div class="health-bar-container">
                <div class="character-name"><span>المقاتل الاسطوري</span><span id="player-hp-text">100</span></div>
                <div class="bar-bg"><div id="player-hp" class="hp-fill"></div></div>
                <div class="bar-bg" style="height: 6px; margin-top: 4px;">
                    <div id="player-energy" class="energy-fill"></div>
                </div>
            </div>
            
            <div class="stage-badge" id="stage-text">المرحلة 1</div>

            <div class="health-bar-container">
                <div class="character-name"><span id="enemy-hp-text">100</span><span>الخصم</span></div>
                <div class="bar-bg"><div id="enemy-hp" class="hp-fill"></div></div>
            </div>
        </div>

        <!-- Battlefield Area -->
        <div id="arena">
            <div id="player" class="character">
                <div class="char-body player-visual">⚡
                    <div id="player-shield" class="shield-aura"></div>
                </div>
            </div>
            <div id="enemy" class="character">
                <div class="char-body enemy-visual">🔥</div>
            </div>
        </div>

        <!-- Skill Cards / Controls -->
        <div class="controls-deck">
            <div class="tech-card" onclick="castTechnique(0)">
                <div class="tech-icon">🔥</div>
                <div class="tech-name">شعاع النار</div>
                <div class="tech-cost">طاقة: 20</div>
            </div>
            <div class="tech-card" onclick="castTechnique(1)">
                <div class="tech-icon">⚡</div>
                <div class="tech-name">البرق السريع</div>
                <div class="tech-cost">طاقة: 35</div>
            </div>
            <div class="tech-card" onclick="castTechnique(2)">
                <div class="tech-icon">🛡️</div>
                <div class="tech-name">درع الكي</div>
                <div class="tech-cost">طاقة: 30</div>
            </div>
            <div class="tech-card" onclick="castTechnique(3)">
                <div class="tech-icon">💥</div>
                <div class="tech-name">التقنية الخارقة</div>
                <div class="tech-cost">طاقة: 80</div>
            </div>
        </div>

        <!-- Start Screen -->
        <div id="start-screen" class="screen">
            <h1 style="font-size: 36px; color: #00d2ff; text-shadow: 0 0 15px #00d2ff; margin-bottom: 8px;">ساحة التقنيات</h1>
            <p style="color: #aaa; font-size: 18px; margin-bottom: 25px;">صراع الأسطورة</p>
            <button class="btn" onclick="startGame()">ابدأ المعركة</button>
        </div>

        <!-- Game Over / Victory Screen -->
        <div id="end-screen" class="screen" style="display: none;">
            <h2 id="end-title" style="font-size: 34px; margin-bottom: 12px; text-shadow: 0 0 10px currentColor;">انتصار!</h2>
            <p id="end-sub" style="color: #ccc; font-size: 16px;">لقد هزمت الخصم بنجاح</p>
            <button class="btn" id="end-btn" onclick="nextStage()">المرحلة التالية</button>
        </div>

        <!-- Beam Struggle / Clash Overlay -->
        <div id="clash-overlay" class="clash-overlay">
            <h2 style="color: #ffcc00; text-shadow: 0 0 15px #ffcc00; font-size: 26px;">تصادم التقنيات!</h2>
            <p style="color: #ddd; margin-top: 5px;">اضغط بسرعة لتغلب هجوم الخصم!</p>
            <div class="clash-meter-bg">
                <div id="clash-meter" class="clash-meter-fill"></div>
            </div>
            <div class="tap-btn" onclick="tapClash()">اضغط!</div>
        </div>
    </div>

    <script>
        // Game Logic Setup
        let player = { hp: 100, maxHp: 100, energy: 0, shield: false };
        let enemy = { hp: 100, maxHp: 100, energy: 0 };
        let stage = 1;
        let gameActive = false;
        let projectiles = [];
        let isClashing = false;
        let clashProgress = 50;

        const techniques = [
            { name: 'شعاع النار', cost: 20, speed: 7, power: 18, color: '#ff4500', size: 22, icon: '🔥' },
            { name: 'البرق السريع', cost: 35, speed: 13, power: 28, color: '#00ffff', size: 16, icon: '⚡' },
            { name: 'درع الكي', cost: 30, isShield: true },
            { name: 'التقنية الخارقة', cost: 80, speed: 4.5, power: 60, color: '#ff00ff', size: 38, icon: '💥' }
        ];

        function startGame() {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('end-screen').style.display = 'none';
            resetBattle();
            gameActive = true;
            requestAnimationFrame(gameLoop);
        }

        function resetBattle() {
            player.hp = player.maxHp;
            player.energy = 0;
            player.shield = false;
            document.getElementById('player-shield').style.display = 'none';

            enemy.maxHp = 90 + (stage * 20);
            enemy.hp = enemy.maxHp;
            enemy.energy = 0;
            
            // Remove old projectiles
            projectiles.forEach(p => p.element.remove());
            projectiles = [];
            
            updateHUD();
        }

        function updateHUD() {
            document.getElementById('player-hp').style.width = Math.max(0, (player.hp / player.maxHp * 100)) + '%';
            document.getElementById('player-hp-text').innerText = Math.ceil(Math.max(0, player.hp));
            document.getElementById('player-energy').style.width = player.energy + '%';

            document.getElementById('enemy-hp').style.width = Math.max(0, (enemy.hp / enemy.maxHp * 100)) + '%';
            document.getElementById('enemy-hp-text').innerText = Math.ceil(Math.max(0, enemy.hp));
            document.getElementById('stage-text').innerText = 'المرحلة ' + stage;

            // Card state updates
            const cards = document.querySelectorAll('.tech-card');
            cards.forEach((card, idx) => {
                if (player.energy >= techniques[idx].cost) {
                    card.classList.remove('disabled');
                    card.classList.add('active');
                } else {
                    card.classList.add('disabled');
                    card.classList.remove('active');
                }
            });
        }

        function castTechnique(idx) {
            if (!gameActive || isClashing) return;
            const tech = techniques[idx];
            
            if (player.energy >= tech.cost) {
                player.energy -= tech.cost;
                
                if (tech.isShield) {
                    player.shield = true;
                    document.getElementById('player-shield').style.display = 'block';
                    setTimeout(() => {
                        player.shield = false;
                        document.getElementById('player-shield').style.display = 'none';
                    }, 3500);
                } else {
                    spawnProjectile(tech, true);
                }
                updateHUD();
            }
        }

        function enemyAI() {
            if (!gameActive || isClashing) return;
            enemy.energy += 0.25 + (stage * 0.05);
            
            if (enemy.energy >= 30 && Math.random() < 0.025) {
                enemy.energy -= 30;
                let enemyTech = { 
                    name: 'هجوم الخصم', 
                    speed: 6 + (stage * 0.5), 
                    power: 12 + (stage * 4), 
                    color: '#ff0055', 
                    size: 24, 
                    icon: '🔥' 
                };
                spawnProjectile(enemyTech, false);
            }
        }

        function spawnProjectile(tech, isPlayer) {
            const arena = document.getElementById('arena');
            const elem = document.createElement('div');
            elem.className = 'projectile';
            elem.style.width = tech.size + 'px';
            elem.style.height = tech.size + 'px';
            elem.style.backgroundColor = tech.color;
            elem.style.boxShadow = `0 0 15px ${tech.color}`;
            elem.innerText = tech.icon || '';

            let startX = isPlayer ? 110 : arena.clientWidth - 110;
            elem.style.left = startX + 'px';

            arena.appendChild(elem);

            projectiles.push({
                element: elem,
                x: startX,
                speed: isPlayer ? tech.speed : -tech.speed,
                power: tech.power,
                isPlayer: isPlayer
            });
        }

        function gameLoop() {
            if (!gameActive) return;

            if (player.energy < 100) player.energy += 0.25;
            enemyAI();
            updateHUD();

            const arenaWidth = document.getElementById('arena').clientWidth;
            
            for (let i = projectiles.length - 1; i >= 0; i--) {
                let p = projectiles[i];
                p.x += p.speed;
                p.element.style.left = p.x + 'px';

                // Hit enemy
                if (p.isPlayer && p.x >= arenaWidth - 90) {
                    enemy.hp -= p.power;
                    destroyProjectile(i);
                    checkBattleStatus();
                } 
                // Hit player
                else if (!p.isPlayer && p.x <= 90) {
                    if (!player.shield) {
                        player.hp -= p.power;
                    }
                    destroyProjectile(i);
                    checkBattleStatus();
                }

                // Check clash between opposite projectiles
                for (let j = i - 1; j >= 0; j--) {
                    let p2 = projectiles[j];
                    if (p.isPlayer !== p2.isPlayer && Math.abs(p.x - p2.x) < 25) {
                        triggerClash(i, j);
                        break;
                    }
                }
            }

            requestAnimationFrame(gameLoop);
        }

        function destroyProjectile(index) {
            if (projectiles[index]) {
                projectiles[index].element.remove();
                projectiles.splice(index, 1);
            }
        }

        function triggerClash(idx1, idx2) {
            isClashing = true;
            destroyProjectile(idx1);
            destroyProjectile(idx2);
            
            clashProgress = 50;
            document.getElementById('clash-meter').style.width = clashProgress
